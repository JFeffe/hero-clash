<!doctype html><html lang="fr"><meta charset="utf-8"><title>Hero Clash · Équipements</title><style>body{margin:0;background:#111923;color:#eee5d3;font:16px system-ui}main{max-width:1200px;margin:auto;padding:20px}button,select{padding:8px;background:#253140;color:white;border:1px solid #9e865a;margin:5px}canvas{width:100%;height:auto;image-rendering:pixelated}a{color:#e5c78d}</style><main><a href="./">← Hero Clash</a><h1>Équipements · assemblage en jeu</h1><select id="pose"><option>Repos</option><option>Course A</option><option>Course B</option><option>Attaque</option><option>Blessure</option><option>KO</option></select><button id="flip">Inverser</button><button id="variant">Autres équipements</button><button id="identity">Autres visages</button><p id="status">Chargement…</p><canvas width="1200" height="1080"></canvas></main><script type="module">
import {D,hero,equipmentPool} from './engine.js';import {sprite,pet,loadAtlas} from './art.js';import {equipmentAssets,drawObjectCombat} from './equipment-art.js';
const ctx=document.querySelector('canvas').getContext('2d');let variant=0,identity=0,flip=false,pose=0;await loadAtlas();document.querySelector('#status').textContent=Object.values(equipmentAssets).every(Boolean)?'Tous les nouveaux sprites sont chargés.':'Un atlas manque.';
function render(){ctx.fillStyle='#111923';ctx.fillRect(0,0,1200,1080);D.ACTIVE_CLASSES.forEach((cls,i)=>{const x=i%3*400,y=Math.floor(i/3)*360,h=hero(1,cls),w=equipmentPool(cls,0),a=equipmentPool(cls,1),wp=w.filter(id=>id>=19||[2,3,5].includes(id)),ap=a.filter(id=>id>=28),ws=wp.length?wp:w,as=ap.length?ap:a;h.appearance={gender:identity%2,face:Math.floor(identity/2)%3,hair:identity%4};h.inventory=[{id:ws[variant%ws.length],level:1},{id:as[variant%as.length],level:1},{id:32,level:1},{id:[15,16,17,18,33,34][(i+variant)%6],level:1}];h.equipped=[0,1,2,3];ctx.fillStyle='#1b2634';ctx.fillRect(x+8,y+8,384,344);ctx.strokeStyle='#726344';ctx.strokeRect(x+8,y+8,384,344);ctx.fillStyle='#edd7aa';ctx.font='bold 20px Georgia';ctx.fillText(D.CLASSES[cls],x+22,y+36);ctx.fillStyle='#cbd1d6';ctx.font='13px system-ui';ctx.fillText((D.MAGIC_CLASSES.includes(cls)?'Intelligence · magie':'Force · physique')+' · '+(D.RANGED_CLASSES.includes(cls)?'Distance':'Corps à corps'),x+22,y+58);const params=pose===1||pose===2?{run:1}:pose===3?{attack:1}:pose===4?{hurt:1}:{};sprite(ctx,h,x+210,y+181,3.1,flip,pose===2?.13:0,pose===5?1:false,params);pet(ctx,h,x+85,y+263,2.15,flip,0,pose===3?1:0,{fallen:pose===5,run:pose===1||pose===2,hurt:pose===4});drawObjectCombat(ctx,h,x+210,y+266,3.1,0,[],0,false,pose===5);ctx.fillStyle='#eee5d3';ctx.font='13px system-ui';ctx.fillText(h.inventory.slice(0,2).map(it=>D.ITEMS[it.id].name).join(' · '),x+20,y+315);ctx.fillStyle='#c2ac83';ctx.fillText(D.ITEMS[h.inventory[3].id].name+' · Tortue',x+20,y+336);});}
window.equipmentReview={change:(v=0,p=0,f=false,a=0)=>{variant=v;pose=p;flip=f;identity=a;render();},ready:true};render();document.querySelector('#pose').onchange=e=>{pose=+e.target.value;render();};document.querySelector('#flip').onclick=()=>{flip=!flip;render();};document.querySelector('#variant').onclick=()=>{variant++;render();};document.querySelector('#identity').onclick=()=>{identity++;render();};
</script></html>
