<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Clash · Warrior</title><link rel="stylesheet" href="./style.css?v=0.11.0"><style>main{max-width:720px}canvas{width:100%;height:auto;image-rendering:pixelated}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:8px}</style><main><a href="./" id="back">← Hero Clash</a><h1 id="title">Warrior appearances</h1><p id="intro"></p><canvas width="720" height="420" aria-label="Warrior appearances preview"></canvas><div class="controls"><label><span id="gender-label">Gender</span><select id="gender"></select></label><label><span id="face-label">Face</span><select id="face"></select></label><label><span id="hair-label">Hairstyle</span><select id="hair"></select></label><label><span id="weapon-label">Weapon</span><select id="weapon"></select></label><label><span id="armor-label">Armor</span><select id="armor"></select></label><label><span id="pose-label">Animation</span><select id="pose"></select></label><label><span id="direction-label">Direction</span><select id="direction"><option value="0">→</option><option value="1">←</option></select></label></div><p role="status" id="status">Loading…</p></main><script type="module">
import {APPEARANCE_OPTIONS} from './appearance.js';
import {sprite,backdrop,loadAtlas} from './art.js?v=0.11.0';
let fr=false;try{fr=JSON.parse(localStorage.getItem('hero-clash-mobile-v02'))?.lang==='fr'}catch{}
const q=(a,b)=>fr?a:b,$=id=>document.getElementById(id);
document.documentElement.lang=fr?'fr':'en';
$('title').textContent=q('Apparences du Guerrier','Warrior appearances');$('intro').textContent=q('Essaie les 24 apparences avec les six armes et quatre armures. Cet aperçu ne modifie pas tes héros.','Try 24 appearances with six weapons and four armors. This preview does not change your heroes.');
for(const [id,frText,enText] of [['gender-label','Genre','Gender'],['face-label','Visage','Face'],['hair-label','Coiffure','Hairstyle'],['direction-label','Direction','Direction'],['weapon-label','Arme','Weapon'],['armor-label','Armure','Armor'],['pose-label','Animation','Animation']])$(id).textContent=q(frText,enText);
const lists={...Object.fromEntries(Object.entries(APPEARANCE_OPTIONS).map(([key,values])=>[key,values.map(names=>q(...names))])),weapon:q(['Épée','Fusil','Arc','Bâton','Dague','Masse'],['Sword','Rifle','Bow','Staff','Dagger','Mace']),armor:q(['Plaque','Veste tactique','Tunique','Cuir noir'],['Plate','Tactical vest','Tunic','Black leather']),pose:q(['Repos','Course','Attaque','Blessure','Mort'],['Idle','Run','Attack','Hurt','Death'])};
for(const [id,labels] of Object.entries(lists))$(id).innerHTML=labels.map((s,i)=>`<option value="${i}">${s}</option>`).join('');
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');const loaded=await loadAtlas();$('status').textContent=loaded?q('24 apparences · 6 armes · 4 armures','24 appearances · 6 weapons · 4 armors'):q('Images indisponibles. Recharge la page.','Images unavailable. Reload the page.');
function tick(ms){const t=ms/1000,p=+$('pose').value,h={class:0,look:0,appearance:{gender:+$('gender').value,face:+$('face').value,hair:+$('hair').value},inventory:[{id:+$('weapon').value},{id:6+(+$('armor').value)}],equipped:[0,1,-1,-1]};backdrop(ctx,720,420);const pose=p===1?{run:1}:p===2?{attack:1}:p===3?{hurt:1}:{};sprite(ctx,h,360,195,4.1,!!+$('direction').value,t,p===4?1:false,pose);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
