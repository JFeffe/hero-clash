<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Clash · Pixel rétro</title><link rel="stylesheet" href="./style.css?v=0.29.2"><style>main{max-width:720px}canvas{width:100%;height:auto;image-rendering:pixelated}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:8px}</style><main><a href="./" id="back">← Hero Clash</a><h1 id="title">Warrior appearances</h1><p id="intro"></p><canvas width="720" height="420" aria-label="Active hero equipment preview"></canvas><div class="controls"><label><span id="class-label">Classe</span><select id="class"><option value="0">Guerrier</option><option value="1">Archer</option><option value="2">Mage</option><option value="10">Nécromancien</option><option value="12">Boxeur</option><option value="6">Ninja</option><option value="4">Chevalier</option><option value="7">Moine</option><option value="3">Trooper</option><option value="8">Ingénieur</option><option value="9">Berserker</option><option value="5">Joker</option></select></label><label><span id="gender-label">Gender</span><select id="gender"></select></label><label><span id="face-label">Face</span><select id="face"></select></label><label><span id="hair-label">Hairstyle</span><select id="hair"></select></label><label><span id="weapon-label">Weapon</span><select id="weapon"></select></label><label><span id="armor-label">Armor</span><select id="armor"></select></label><label><span id="pet-label">Familier</span><select id="pet"></select></label><label><span id="trinket-label">Objet</span><select id="trinket"></select></label><label><span id="pose-label">Animation</span><select id="pose"></select></label><label><span id="direction-label">Direction</span><select id="direction"><option value="0">→</option><option value="1">←</option></select></label></div><p id="equipment-info"></p><p role="status" id="status">Loading…</p></main><script type="module">
import {D,equipmentPool} from './engine.js';
import {APPEARANCE_OPTIONS,appearanceOptions} from './appearance.js';
import {sprite,pet,backdrop,loadAtlas} from './art.js';
const $=id=>document.getElementById(id),fr=(navigator.language||'').startsWith('fr'),q=(a,b)=>fr?a:b,tr=x=>fr?x:D.EN[x]??x;
$('title').textContent=q('Aperçu des équipements compatibles','Compatible equipment preview');
$('intro').textContent=q('9 classes · 4 emplacements. Les nouveaux sprites sont intégrés : armes, armures, tortue et objets portés. Cet aperçu ne modifie pas la partie.','9 classes · 4 slots. New sprites are integrated: weapons, armor, turtle and worn objects. This preview does not change your save.');
$('class').innerHTML=D.ACTIVE_CLASSES.map(id=>`<option value="${id}">${tr(D.CLASSES[id])}</option>`).join('');
const lists={...Object.fromEntries(Object.entries(APPEARANCE_OPTIONS).map(([key,values])=>[key,values.map(names=>q(...names))])),pose:q(['Repos','Course','Attaque','Blessure','KO'],['Idle','Run','Attack','Hurt','KO'])};
for(const [id,labels] of Object.entries(lists))$(id).innerHTML=labels.map((name,i)=>`<option value="${i}">${name}</option>`).join('');
const slots=['weapon','armor','pet','trinket'];
function refreshEquipment(){for(const [slot,id] of slots.entries()){$(id).innerHTML=`<option value="-1">${q('Aucun','None')}</option>`+equipmentPool(+$('class').value,slot).map(i=>`<option value="${i}">${tr(D.ITEMS[i].name)}</option>`).join('');$(id).selectedIndex=1;}describeEquipment();}
function describeEquipment(){$('equipment-info').textContent=slots.map(id=>D.ITEMS[+$(id).value]).filter(Boolean).map(it=>`${tr(it.name)} : ${tr(it.text)}`).join(' · ');}
function refreshAppearance(){for(const [id,values] of Object.entries(appearanceOptions({class:+$('class').value}))){const current=$(id).value;$(id).innerHTML=values.map((v,i)=>`<option value="${i}">${q(...v)}</option>`).join('');$(id).value=current;}}
$('class').addEventListener('change',()=>{refreshAppearance();refreshEquipment();});for(const id of slots)$(id).addEventListener('change',describeEquipment);refreshEquipment();
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');const loaded=await loadAtlas();$('status').textContent=loaded?q('Sprites chargés · équipement visible','Sprites loaded · equipment visible'):q('Images indisponibles.','Images unavailable.');
function tick(ms){const t=ms/1000,p=+$('pose').value,h={class:+$('class').value,look:0,appearance:{gender:+$('gender').value,face:+$('face').value,hair:+$('hair').value},inventory:slots.map(id=>({id:+$(id).value,level:1,rarity:0})),equipped:slots.map((id,i)=>+$(id).value<0?-1:i)};backdrop(ctx,720,420);const pose=p===1?{run:1}:p===2?{attack:1}:p===3?{hurt:1}:{};sprite(ctx,h,300,195,4.1,!!+$('direction').value,t,p===4?1:false,pose);pet(ctx,h,550,275,3.2,!!+$('direction').value,t,p===2?1:0,{run:p===1,hurt:p===3,fallen:p===4});requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
