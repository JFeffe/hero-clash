<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero Clash · Pixel rétro</title><link rel="stylesheet" href="./style.css?v=0.20.0"><style>main{max-width:720px}canvas{width:100%;height:auto;image-rendering:pixelated}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:8px}</style><main><a href="./" id="back">← Hero Clash</a><h1 id="title">Warrior appearances</h1><p id="intro"></p><canvas width="720" height="420" aria-label="Warrior, Archer, Mage Necromancer, Boxer, Ninja, Knight and Monk preview"></canvas><div class="controls"><label><span id="class-label">Classe</span><select id="class"><option value="0">Guerrier</option><option value="1">Archer</option><option value="2">Mage</option><option value="10">Nécromancien</option><option value="12">Boxeur</option><option value="6">Ninja</option><option value="4">Chevalier</option><option value="7">Moine</option></select></label><label><span id="gender-label">Gender</span><select id="gender"></select></label><label><span id="face-label">Face</span><select id="face"></select></label><label><span id="hair-label">Hairstyle</span><select id="hair"></select></label><label><span id="weapon-label">Weapon</span><select id="weapon"></select></label><label><span id="armor-label">Armor</span><select id="armor"></select></label><label><span id="pet-label">Familier</span><select id="pet"></select></label><label><span id="trinket-label">Objet</span><select id="trinket"></select></label><label><span id="pose-label">Animation</span><select id="pose"></select></label><label><span id="direction-label">Direction</span><select id="direction"><option value="0">→</option><option value="1">←</option></select></label></div><p id="equipment-info"></p><p role="status" id="status">Loading…</p></main><script type="module">
import {DATA as D} from './data.js';
import {APPEARANCE_OPTIONS} from './appearance.js';
import {sprite,pet,backdrop,loadAtlas,familiarStatus} from './art.js?v=0.20.0';
let fr=false;try{fr=JSON.parse(localStorage.getItem('hero-clash-mobile-v02'))?.lang==='fr'}catch{}
const q=(a,b)=>fr?a:b,$=id=>document.getElementById(id);
document.documentElement.lang=fr?'fr':'en';
$('title').textContent=q('Pixel rétro · Guerrier, Archer, Mage, Nécromancien, Boxeur, Ninja, Chevalier et Moine','Retro pixel · Warrior, Archer, Mage, Necromancer, Boxer, Ninja, Knight and Monk');$('intro').textContent=q('Compare les huit classes, leurs six armes et quatre tenues. Les visages et coiffures sont personnalisables pour les huit classes. Essaie aussi les cinq familiers. Les objets sont sélectionnables mais ne changent pas le dessin du héros. Cet aperçu ne modifie pas tes héros.','Compare all eight classes, their six weapons and four outfits. Faces and hairstyles for all eight classes can be customized. Try all five familiars too. Trinkets are selectable but do not alter the hero drawing. This preview does not change your heroes.');
for(const [id,frText,enText] of [['pet-label','Familier','Familiar'],['trinket-label','Objet','Trinket'],['gender-label','Genre','Gender'],['face-label','Visage','Face'],['hair-label','Coiffure','Hairstyle'],['direction-label','Direction','Direction'],['weapon-label','Arme','Weapon'],['armor-label','Armure','Armor'],['pose-label','Animation','Animation']])$(id).textContent=q(frText,enText);
$('class').options[7].textContent=q('Moine','Monk');$('class').options[6].textContent=q('Chevalier','Knight');$('class').options[4].textContent=q('Boxeur','Boxer');$('class-label').textContent=q('Classe','Class');$('class').options[0].textContent=q('Guerrier','Warrior');$('class').options[3].textContent=q('Nécromancien','Necromancer');
for(const id of [3,5,8,9,11]){const option=document.createElement('option');option.value=id;option.textContent=(fr?D.CLASSES[id]:D.EN[D.CLASSES[id]]??D.CLASSES[id])+q(' · classique',' · classic');$('class').append(option);}
const lists={...Object.fromEntries(Object.entries(APPEARANCE_OPTIONS).map(([key,values])=>[key,values.map(names=>q(...names))])),weapon:q(['Épée','Fusil','Arc','Bâton','Dague','Masse'],['Sword','Rifle','Bow','Staff','Dagger','Mace']),armor:q(['Plaque','Veste tactique','Tunique','Cuir noir'],['Plate','Tactical vest','Tunic','Black leather']),pose:q(['Repos','Course','Attaque','Blessure','KO · yeux fermés'],['Idle','Run','Attack','Hurt','KO · eyes closed'])};
lists.pet=q(['Loup agile','Chien militaire','Chat ninja','Corbeau du chaos','Fée curieuse'],['Agile wolf','Military dog','Ninja cat','Chaos raven','Curious fairy']);lists.trinket=q(['Lunettes tactiques','Amulette du néant','Talisman de chance','Potion étrange'],['Tactical goggles','Void amulet','Lucky talisman','Strange potion']);
for(const [id,labels] of Object.entries(lists))$(id).innerHTML=labels.map((s,i)=>`<option value="${i}">${s}</option>`).join('');
for(const id of ['weapon','armor','pet','trinket'])$(id).insertAdjacentHTML('afterbegin',`<option value="-1">${q('Aucun','None')}</option>`);$('weapon').value='0';$('armor').value='0';$('pet').value='0';$('trinket').value='-1';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');const loaded=await loadAtlas();$('status').textContent=loaded?q('8 classes modernisées + 5 classiques · 6 armes · 4 tenues · '+familiarStatus().filter(Boolean).length+'/5 familiers chargés','8 modernized + 5 classic classes · 6 weapons · 4 outfits · '+familiarStatus().filter(Boolean).length+'/5 familiars loaded'):q('Images indisponibles. Recharge la page.','Images unavailable. Reload the page.');
function describeEquipment(){const selected=['weapon','armor','pet','trinket'].map((id,slot)=>{const n=+$(id).value;if(n<0)return '';const item=D.ITEMS[n+[0,6,10,15][slot]];return `${fr?item.name:D.EN[item.name]??item.name} : ${fr?item.text:D.EN[item.text]??item.text}`;}).filter(Boolean);$('equipment-info').textContent=selected.join(' · ');}
for(const id of ['weapon','armor','pet','trinket'])$(id).addEventListener('change',describeEquipment);describeEquipment();
function tick(ms){const t=ms/1000,p=+$('pose').value,h={class:+$('class').value,look:0,appearance:{gender:+$('gender').value,face:+$('face').value,hair:+$('hair').value},inventory:[{id:+$('weapon').value},{id:6+(+$('armor').value)},{id:10+(+$('pet').value)},{id:15+(+$('trinket').value)}],equipped:['weapon','armor','pet','trinket'].map((id,i)=>+$(id).value<0?-1:i)};backdrop(ctx,720,420);const pose=p===1?{run:1}:p===2?{attack:1}:p===3?{hurt:1}:{};sprite(ctx,h,300,195,4.1,!!+$('direction').value,t,p===4?1:false,pose);pet(ctx,h,550,275,3.2,!!+$('direction').value,t,p===2?1:0,{run:p===1,hurt:p===3,fallen:p===4});requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
